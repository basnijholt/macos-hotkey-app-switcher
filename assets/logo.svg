<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>app-hotkeys</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F7BFF"/>
      <stop offset="1" stop-color="#7B3FF2"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A3470"/>
      <stop offset="1" stop-color="#25204F"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <!-- the app behind -->
  <rect x="40" y="18" width="66" height="46" rx="7" fill="#fff" fill-opacity=".28"/>
  <!-- the app brought to the front -->
  <rect x="20" y="32" width="68" height="50" rx="7" fill="#fff"/>
  <circle cx="29" cy="41" r="2.8" fill="#FF5F57"/>
  <circle cx="37" cy="41" r="2.8" fill="#FEBC2E"/>
  <circle cx="45" cy="41" r="2.8" fill="#28C840"/>
  <rect x="29" y="53" width="40" height="5" rx="2.5" fill="#C9D3FF"/>
  <rect x="29" y="63" width="28" height="5" rx="2.5" fill="#E2E7FF"/>
  <!-- the keycap -->
  <rect x="64" y="64" width="48" height="48" rx="12" fill="#151233" fill-opacity=".35" transform="translate(0 3)"/>
  <rect x="64" y="64" width="48" height="48" rx="12" fill="#1B1740"/>
  <rect x="68" y="66" width="40" height="38" rx="9" fill="url(#cap)"/>
  <path d="M88 73 100 85H93V95H83V85H76Z" fill="#fff" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>
</svg>
